<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | JobNest</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="brand">Job<span>Nest</span></div>
  <div class="nav-links"><a href="index.html">Browse Jobs</a></div>
</nav>
<div class="auth-wrap">
  <div class="form-card">
    <h2>Welcome back</h2>
    <p class="sub">Log in to your account. Admins land on the admin dashboard automatically.</p>
    <div id="msg"></div>
    <form id="login-form">
      <div class="field"><label>Email</label><input type="email" id="email" required></div>
      <div class="field"><label>Password</label><input type="password" id="password" required></div>
      <button class="btn btn-primary btn-block" type="submit">Log In</button>
    </form>
    <div class="form-footer">Don't have an account? <a href="register.html" style="color: var(--purple-light);">Sign up</a></div>
  </div>
</div>
<script src="js/api.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.innerHTML = '';
  try {
    const data = await apiRequest('/auth/login', {
      method: 'POST',
      body: {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      }
    });
    saveSession(data.token, data.user);
    window.location.href = data.user.role === 'admin' ? 'admin.html' : 'dashboard.html';
  } catch (err) {
    msg.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
  }
});
</script>
</body>
</html>
